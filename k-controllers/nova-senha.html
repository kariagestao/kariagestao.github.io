<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K Controllers — Nova senha</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --musgo: #0D1F2D;
    --cobre: #B87333;
    --claro: #F8F6F3;
    --texto: #1a2e3f;
    --texto-suave: #4a6070;
    --borda: rgba(13,31,45,0.15);
    --erro: #c0392b;
    --sucesso: #27ae60;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--claro);
    color: var(--texto);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px max(24px, env(safe-area-inset-left, 0px));
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 32px rgba(13,31,45,0.10);
  }
  .logo { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--cobre); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; color: var(--musgo); margin-bottom: 8px; }
  .sub { font-size: 14px; color: var(--texto-suave); margin-bottom: 32px; line-height: 1.5; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-suave); margin-bottom: 8px; }
  input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--borda); border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; color: var(--texto); background: #fff; transition: border-color 0.2s; outline: none; }
  input:focus { border-color: var(--cobre); }
  .hint { font-size: 11px; color: var(--texto-suave); margin-top: 5px; }
  .btn { width: 100%; padding: 16px; background: var(--musgo); color: #fff; border: none; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; margin-top: 8px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { background: #162d40; }
  .btn:disabled { background: #a0b0bb; cursor: not-allowed; }
  .msg { font-size: 13px; padding: 14px 16px; border-radius: 8px; margin-top: 16px; display: none; line-height: 1.5; }
  .msg.erro { background: #fdecea; color: var(--erro); display: block; }
  .msg.ok { background: #eafaf1; color: var(--sucesso); display: block; }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Estado de link inválido */
  .estado-erro-link { text-align: center; padding: 20px 0; }
  .estado-erro-link .icon { font-size: 40px; margin-bottom: 16px; }
  .estado-erro-link p { font-size: 14px; color: var(--texto-suave); margin-bottom: 20px; }
  .btn-voltar { display: inline-block; padding: 12px 24px; background: var(--musgo); color: #fff; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; text-decoration: none; }

  #form-nova { display: none; }
  @media (max-width: 500px) { .card { padding: 32px 24px; } }
</style>

<div class="card">
  <div class="logo">K Controllers · KARIA Gestão</div>

  <!-- Estado: link inválido ou expirado -->
  <div id="estado-link-invalido" style="display:none">
    <div class="estado-erro-link">
      <div class="icon">🔗</div>
      <h1 style="margin-bottom:8px">Link inválido</h1>
      <p>Este link de recuperação expirou ou já foi usado.<br>Solicite um novo link abaixo.</p>
      <a href="/k-controllers/recuperar-senha" class="btn-voltar">Solicitar novo link</a>
    </div>
  </div>

  <!-- Formulário de nova senha -->
  <div id="form-nova">
    <h1>Criar nova senha</h1>
    <p class="sub">Escolha uma senha segura para sua conta.</p>

    <form id="form-senha">
      <div class="form-group">
        <label>Nova senha</label>
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres" minlength="8" required>
        <p class="hint">Use letras, números e símbolos para maior segurança</p>
      </div>
      <div class="form-group">
        <label>Confirmar nova senha</label>
        <input type="password" id="senha2" placeholder="Repita a senha" minlength="8" required>
      </div>

      <button type="submit" class="btn" id="btn-salvar">
        <span class="spinner" id="spin"></span>
        Salvar nova senha
      </button>

      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://olgkcfwnbhnngpqqkppm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ2tjZnduYmhubmdwcXFrcHBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzc5MDUsImV4cCI6MjEwNzc1MzkwNX0.HstBNULsu6PvvJWWF4FG0-lBeJ1OR6QrJoJs-Gyp3-M';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Supabase injeta a sessão via hash (#access_token=...&type=recovery)
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Sessão de recuperação válida — mostra o formulário
      document.getElementById('form-nova').style.display = 'block';
    } else if (!session) {
      // Sem sessão e sem evento de recovery — link inválido
      document.getElementById('estado-link-invalido').style.display = 'block';
    }
  });

  document.getElementById('form-senha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const senha  = document.getElementById('senha').value;
    const senha2 = document.getElementById('senha2').value;
    const btn    = document.getElementById('btn-salvar');
    const spin   = document.getElementById('spin');
    const msg    = document.getElementById('msg');

    msg.className = 'msg';

    if (senha !== senha2) {
      msg.className = 'msg erro';
      msg.textContent = 'As senhas não coincidem.';
      return;
    }

    btn.disabled = true;
    spin.style.display = 'inline-block';

    const { error } = await sb.auth.updateUser({ password: senha });

    if (error) {
      msg.className = 'msg erro';
      msg.textContent = 'Erro ao salvar a senha. Tente novamente.';
      btn.disabled = false;
      spin.style.display = 'none';
    } else {
      msg.className = 'msg ok';
      msg.textContent = 'Senha atualizada com sucesso! Redirecionando...';
      setTimeout(() => { location.href = '/k-controllers/membros'; }, 1800);
    }
  });
</script>

</html>
