<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K Controllers — Ativar conta</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --musgo: #0D1F2D;
    --cobre: #B87333;
    --claro: #F8F6F3;
    --texto: #1a2e3f;
    --texto-suave: #4a6070;
    --borda: rgba(13,31,45,0.15);
    --erro: #c0392b;
    --sucesso: #27ae60;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--claro);
    color: var(--texto);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px max(24px, env(safe-area-inset-left, 0px));
  }

  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 4px 32px rgba(13,31,45,0.10);
  }

  .logo {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--cobre);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--musgo);
    line-height: 1.2;
    margin-bottom: 8px;
    text-wrap: balance;
  }

  .sub {
    font-size: 14px;
    color: var(--texto-suave);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .sub strong { color: var(--cobre); font-weight: 600; }

  .badge-sucesso {
    background: #eafaf1;
    border: 1px solid #a9dfbf;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--sucesso);
    font-weight: 500;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge-sucesso svg { flex-shrink: 0; }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--texto-suave);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--borda);
    border-radius: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: var(--texto);
    background: #fff;
    transition: border-color 0.2s;
    outline: none;
  }

  input:focus { border-color: var(--cobre); }
  input[readonly] { background: #f5f5f5; color: var(--texto-suave); cursor: not-allowed; }

  .hint {
    font-size: 11px;
    color: var(--texto-suave);
    margin-top: 6px;
  }

  .btn {
    width: 100%;
    padding: 16px;
    background: var(--musgo);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover { background: #162d40; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { background: #a0b0bb; cursor: not-allowed; }

  .msg {
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 16px;
    display: none;
  }

  .msg.erro { background: #fdecea; color: var(--erro); display: block; }
  .msg.ok { background: #eafaf1; color: var(--sucesso); display: block; }

  .footer-link {
    text-align: center;
    margin-top: 24px;
    font-size: 13px;
    color: var(--texto-suave);
  }

  .footer-link a { color: var(--cobre); text-decoration: none; font-weight: 500; }

  .loading { display: none; }
  .loading.ativo { display: inline-block; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 8px;
  }

  @media (max-width: 500px) {
    .card { padding: 32px 24px; }
  }
</style>

<div class="card">
  <div class="logo">K Controllers · KARIA Gestão</div>
  <h1>Crie sua senha de acesso</h1>
  <p class="sub">Pagamento confirmado. Configure sua senha para <strong>acessar a área de membros agora</strong>.</p>

  <div class="badge-sucesso" id="badge-sucesso" style="display:none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    Assinatura K Controllers ativada com sucesso
  </div>

  <form id="form-ativar">
    <div class="form-group" id="grupo-nome">
      <label>Seu nome</label>
      <input type="text" id="nome" placeholder="Como prefere ser chamado(a)">
    </div>

    <div class="form-group" id="grupo-email">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">
      <p class="hint">Use o mesmo e-mail do pagamento</p>
    </div>

    <div class="form-group">
      <label>Crie sua senha</label>
      <input type="password" id="senha" placeholder="Mínimo 8 caracteres" minlength="8" required>
    </div>

    <div class="form-group">
      <label>Confirme a senha</label>
      <input type="password" id="senha2" placeholder="Repita a senha" minlength="8" required>
    </div>

    <button type="submit" class="btn" id="btn-ativar">
      <span class="loading" id="spin"><span class="spinner"></span></span>
      Ativar minha conta
    </button>

    <div class="msg" id="msg"></div>
  </form>

  <p class="footer-link">Já tem conta? <a href="/k-controllers/login">Entrar</a></p>
</div>

<script>
  const SUPABASE_URL = 'https://olgkcfwnbhnngpqqkppm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sZ2tjZnduYmhubmdwcXFrcHBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzc5MDUsImV4cCI6MjEwNzc1MzkwNX0.HstBNULsu6PvvJWWF4FG0-lBeJ1OR6QrJoJs-Gyp3-M';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  // Esta página só funciona via link enviado por e-mail após o pagamento.
  // Sem o token no hash → redireciona para login imediatamente.
  if (!location.hash.includes('access_token')) {
    location.replace('/k-controllers/login');
  }

  // Mostra formulário simplificado (só senha, sem e-mail/nome)
  document.getElementById('grupo-nome').style.display = 'none';
  document.getElementById('grupo-email').style.display = 'none';
  document.getElementById('badge-sucesso').style.display = 'flex';
  document.querySelector('.sub').textContent = 'Crie uma senha para acessar sua área de membros agora.';

  document.getElementById('form-ativar').addEventListener('submit', async (e) => {
    e.preventDefault();

    const senha  = document.getElementById('senha').value;
    const senha2 = document.getElementById('senha2').value;
    const btn    = document.getElementById('btn-ativar');
    const spin   = document.getElementById('spin');
    const msg    = document.getElementById('msg');

    msg.className = 'msg';
    msg.textContent = '';

    if (senha !== senha2) {
      msg.className = 'msg erro';
      msg.textContent = 'As senhas não coincidem.';
      return;
    }
    if (senha.length < 8) {
      msg.className = 'msg erro';
      msg.textContent = 'A senha deve ter ao menos 8 caracteres.';
      return;
    }

    btn.disabled = true;
    spin.classList.add('ativo');

    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('Link expirado ou inválido. Verifique seu e-mail ou entre em contato pelo Instagram @kariagestao.');

      const { error } = await sb.auth.updateUser({ password: senha });
      if (error) throw error;

      msg.className = 'msg ok';
      msg.textContent = 'Senha criada! Redirecionando para a área de membros...';
      setTimeout(() => { location.href = '/k-controllers/membros'; }, 1200);

    } catch (err) {
      msg.className = 'msg erro';
      msg.textContent = err.message || 'Erro ao criar senha. Tente novamente.';
      btn.disabled = false;
      spin.classList.remove('ativo');
    }
  });
</script>

</html>
